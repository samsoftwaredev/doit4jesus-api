                    notification_type: friend_request_received
                    title: New friend request
                    body: John Paul wants to be your friend.
                    action_url: /friends/requests
                    payload: { friendRequestId: fb000000-0000-4000-8000-000000000002 }
                    read_at: null
                    created_at: '2026-08-17T10:00:00Z'
                meta: { limit: 20, hasMore: false, nextCursor: null }
  /api/v1/notifications/{notificationId}/read:
    patch:
      summary: Mark one notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Marked as read. The successful response body is empty. }
components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CatalogLanguage:
      in: query
      name: language
      description: >-
        Optional catalog language override. When omitted on authenticated
        endpoints, the user's preferred language is used; otherwise English is
        returned. Localized text replaces the existing text fields.
      schema: { type: string, enum: [en, es] }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: A unique client-generated key. Repeating the same request returns the original result without duplicate rewards.
      schema: { type: string, minLength: 1, maxLength: 150 }
    EncounterId:
      in: path
      name: encounterId
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      schema: { type: string, format: uuid }
    LiturgyCountry:
      in: query
      name: country
      description: Optional two-letter ISO country code used by the calendar resolver.
      schema: { type: string, minLength: 2, maxLength: 2, example: US }
    LiturgyDiocese:
      in: query
      name: diocese
      description: Optional diocesan calendar identifier. Regional proper data is additive to the universal calendar.
      schema: { type: string, minLength: 1, maxLength: 100, example: dallas }
    LiturgyLocale:
      in: query
      name: locale
      description: >-
        Optional BCP 47 locale. es and es-* select Spanish Biblia de Jerusalén
        verse text; all other locales use English NABRE. The canonical citation
        remains translation-neutral.
      schema: { type: string, example: es-MX }
    ExaminationCategory:
      in: query
      name: category
      schema: { type: string, enum: [single, married, religious] }
    ExaminationSaint:
      in: query
      name: saint
      description: Exact saint-name match in the selected language, case-insensitive.
      schema: { type: string, minLength: 1, maxLength: 120 }
    ExaminationCommandment:
      in: query
      name: commandment
      schema: { type: integer, minimum: 1, maximum: 10 }
    ExaminationType:
      in: query
      name: type
      schema: { type: string, enum: [mortal, grave] }
    ExaminationDate:
      in: query
      name: date
      description: Deprecated. Accepted for backwards compatibility but ignored by this endpoint.
      schema: { type: string, format: date }
    ExaminationRandomQuestion:
      in: query
      name: randomQuestion
      description: When true, return one randomly selected matching question instead of a list.
      schema: { type: boolean, default: false }
    ExaminationQuestionId:
      in: path
      name: questionId
      required: true
      schema: { type: string, format: uuid }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    Unauthorized:
      description: Missing or invalid Supabase Auth session
    ValidationError:
      description: Request validation failed
  schemas:
    ScreenDataResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [screen, sections]
          properties:
            screen: { type: string, enum: [home, prayer, community] }
            sections:
              type: object
              description: >-
                Home keys: rosaryStreak, rosaryStats, progress, rosaryReminder,
                liturgyToday, scriptureActivities, levels, rosaryActivities,
                examinationQuestion, badges. Prayer keys: prayerIntentions, me,
                rosaryCompletion, rosaryStreak, weeklyGlobalLeaderboard,
                yearlyGlobalLeaderboard. Community keys: friends,
                incomingFriendRequests, friendsWeeklyLeaderboard. Each value is
                either `{ data, meta? }`, matching its standalone endpoint, or null.
              additionalProperties:
                anyOf:
                  - type: 'null'
                  - type: object
                    required: [data]
                    properties:
                      data: {}
                      meta: { type: object, additionalProperties: true }
        meta:
          type: object
          additionalProperties: false
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
    ContactSubject:
      type: string
      description: |-
        Select one category, or `Other` and provide `otherSubject`.
        - Billing & Payments — Premium subscription issues, receipts, or promotion codes.
        - Subscription Management — Trials, plan changes, or premium access.
        - Login & Account Access — Passwords, verification, or deletion requests.
        - App Performance & Bugs — Freezes, crashes, or offline downloads.
        - Audio & Playback Issues — Missing audio, playback speed, or Bluetooth issues.
        - Streak & Progress Issues — Restoring prayer streaks or missing progress.
        - Content Feedback & Requests — Prayers, Novenas, saints, or Bible translations.
        - Prayer Intentions — Questions about sharing community prayer requests.
        - Grammar & Audio Mistakes — Scripture typos or spoken-audio errors.
        - Parish & Church Programs — Parish-wide subscription inquiries.
        - School & Ministry Licensing — Educational pricing inquiries.
        - Media & Press Inquiries — Requests from journalists and media outlets.
      enum:
        - Billing & Payments
        - Subscription Management
        - Login & Account Access
        - App Performance & Bugs
        - Audio & Playback Issues
        - Streak & Progress Issues
        - Content Feedback & Requests
        - Prayer Intentions
        - Grammar & Audio Mistakes
        - Parish & Church Programs
        - School & Ministry Licensing
        - Media & Press Inquiries
        - Other
