openapi: 3.1.0
info:
  title: DoIt4Jesus API
  version: 1.0.0
  description: >-
    REST API implemented with Next.js 16 Route Handlers and Supabase Auth.
    Browser clients may authenticate with Supabase SSR cookies; native clients
    may send a Supabase access token as a Bearer token.
servers:
  - url: https://api.example.com
  - url: http://localhost:3000
security:
  - supabaseBearer: []
paths:
  /api/v1/health:
    get:
      security: []
      summary: Service health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              example:
                data:
                  status: ok
                  service: doit4jesus-api
                  timestamp: '2026-08-17T12:00:00.000Z'
  /api/v1/contact-requests:
    post:
      security: []
      summary: Submit a contact-us request
      description: >-
        Public support form for people who can or cannot sign in. The response
        deliberately returns only the request ID and timestamp; submitted
        contact details and message are never exposed through this API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactRequest' }
      responses:
        '201':
          description: Contact request stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactRequestCreatedResponse' }
              example:
                data: { id: c9000000-0000-4000-8000-000000000001, createdAt: '2026-08-22T12:00:00Z' }
        '400': { description: Request body is missing or is not JSON }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/admin/contact-requests:
    get:
      summary: List contact requests for administrator review
      description: >-
        Returns contact details and messages only to authenticated administrators.
        The created_at filter represents a full UTC calendar day; name is a
        case-insensitive substring match and email is a case-insensitive exact match.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [todo, inprogress, done, all], default: all }
        - in: query
          name: created_at
          schema: { type: string, format: date }
        - in: query
          name: email
          schema: { type: string, format: email, maxLength: 320 }
        - in: query
          name: name
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: subject
          schema: { $ref: '#/components/schemas/ContactSubject' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Contact-request page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactRequestListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator role required }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/admin/users/{userId}:
    delete:
      summary: Permanently delete a user account
      description: >-
        Administrator-only account deletion. It permanently deletes the target
        user's Auth identity and linked application data while retaining only
        their anonymous qualifying Rosary contribution in the global total.
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Account permanently deleted. The successful response body is empty. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator role required }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/prayer-intentions:
    get:
      summary: List approved, unexpired prayer-intention cards
      description: >-
        Only intentions made visible by an administrator are returned. Each
        card expires one month after its approval and includes the creator's
        current display name, avatar, and country code.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Visible prayer-intention card page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrayerIntentionCardListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Submit a prayer intention for administrator approval
      description: >-
        The intention begins as pending and is not visible to other users.
        Descriptions are limited to 250 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePrayerIntention' }
      responses:
        '201':
          description: Pending prayer intention created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrayerIntentionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/prayer-intentions:
    get:
      summary: List the current user's unexpired prayer intentions
      description: >-
        Includes the user's pending, visible, and rejected intentions. A
        rejected intention remains available until its review-based expiry.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, visible, rejected, all], default: all }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Current-user prayer-intention page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPrayerIntentionsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/prayer-intentions/{intentionId}:
    get:
      summary: Get one approved, unexpired prayer-intention card
      description: >-
        Returns only an administrator-approved, unexpired intention. Pending,
        rejected, expired, and unknown intentions all return 404.
      parameters:
        - in: path
          name: intentionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Visible prayer-intention card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrayerIntentionCardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No approved, unexpired prayer intention matches the ID }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/prayer-intentions/{intentionId}/prayers:
    get:
      summary: List people who prayed for an intention
      description: >-
        The list is limited to the intention's creator and administrators. It
        includes one record per prayer, so a person may appear more than once.
      parameters:
        - in: path
          name: intentionId
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Prayer-record page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrayerIntentionPrayerListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Prayer intention not found or not accessible }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Record one prayer for an approved intention
      description: >-
        Records an append-only prayer for the authenticated user. A user may
        pray for the same visible intention more than once; no undo is offered.
      parameters:
        - in: path
          name: intentionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Prayer recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrayerIntentionPrayerCreatedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No approved, unexpired prayer intention matches the ID }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/admin/prayer-intentions:
    get:
      summary: List prayer intentions for administrator review
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, visible, rejected, all], default: pending }
        - in: query
          name: createdAt
          description: Full UTC calendar-day filter.
          schema: { type: string, format: date }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Administrator prayer-intention page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPrayerIntentionsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator role required }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/admin/prayer-intentions/{intentionId}:
    patch:
      summary: Make a pending prayer intention visible or reject it
      description: >-
        Visible and rejected intentions expire one month after this review.
        A visible approval increments the creator's lifetime approved count and
        awards the 1, 3, or 7-intention badge when a threshold is reached.
      parameters:
        - in: path
          name: intentionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewPrayerIntention' }
      responses:
        '200':
          description: Prayer intention reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrayerIntentionReviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator role required }
        '404': { description: Prayer intention not found }
        '409': { description: Prayer intention was already reviewed }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/examination-of-conscience:
    get:
      security:
        - supabaseBearer: []
        - {}
      summary: List active examination-of-conscience questions or select one at random
      description: >-
        Returns every active, curated question matching the supplied filters.
        Set randomQuestion=true to return one randomly selected matching
        question instead. Authentication is optional; when language is omitted,
        an authenticated user's preferred language is used.
      parameters:
        - { $ref: '#/components/parameters/CatalogLanguage' }
        - { $ref: '#/components/parameters/ExaminationCategory' }
        - { $ref: '#/components/parameters/ExaminationSaint' }
        - { $ref: '#/components/parameters/ExaminationCommandment' }
        - { $ref: '#/components/parameters/ExaminationType' }
        - { $ref: '#/components/parameters/ExaminationDate' }
        - { $ref: '#/components/parameters/ExaminationRandomQuestion' }
      responses:
        '200':
          description: A matching question when randomQuestion=true; otherwise the matching list
          content:
            application/json:
              oneOf:
                - { $ref: '#/components/schemas/ExaminationQuestionResponse' }
                - { $ref: '#/components/schemas/PublicExaminationQuestionListResponse' }
        '404': { description: No active question matches the supplied filters when randomQuestion=true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/examination-of-conscience/daily:
    get:
      security:
        - supabaseBearer: []
        - {}
      summary: Get the deterministic daily examination-of-conscience question
      description: >-
        Returns one active, curated question for the resolved calendar date and
        supplied filters. The same date and filters always select the same
        question. When date is omitted, the endpoint resolves today using
        EXAMINATION_TIMEZONE (America/Chicago by default). This endpoint is
        optionally authenticated; when language is omitted, an authenticated
        user's preferred language is used.
      parameters:
        - { $ref: '#/components/parameters/CatalogLanguage' }
        - { $ref: '#/components/parameters/ExaminationCategory' }
        - { $ref: '#/components/parameters/ExaminationSaint' }
        - { $ref: '#/components/parameters/ExaminationCommandment' }
        - { $ref: '#/components/parameters/ExaminationType' }
        - in: query
          name: date
          description: Optional ISO calendar date for historical or preview selection.
          schema: { type: string, format: date }
      responses:
        '200':
          description: The question selected for the resolved date and filters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExaminationQuestionResponse' }
              example:
                data:
                  id: e1000000-0000-4000-8000-000000000001
                  category: single
                  title: Faith
                  commandment: 1
                  type: mortal
                  question: Have I denied or deliberately doubted the Catholic faith?
                  description: Deliberate rejection of the faith concerns our relationship with God.
                  counsels: [Return to Christ through prayer and Confession.]
                  prevention: [Keep a faithful daily prayer routine.]
                  saints: [St. Augustine]
                  isActive: true
                  createdAt: '2026-08-22T00:00:00.000Z'
                  updatedAt: '2026-08-22T00:00:00.000Z'
                meta:
                  asOfDate: '2026-08-29'
                  filters: { category: single, date: '2026-08-29' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No active question matches the supplied filters }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/admin/examination-of-conscience:
    get:
      summary: List examination-of-conscience questions for administration
      parameters:
        - { $ref: '#/components/parameters/ExaminationCategory' }
        - { $ref: '#/components/parameters/ExaminationSaint' }
        - { $ref: '#/components/parameters/ExaminationCommandment' }
        - { $ref: '#/components/parameters/ExaminationType' }
        - in: query
          name: includeInactive
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Page of questions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExaminationQuestionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator role required }
    post:
      summary: Create an examination-of-conscience question
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExaminationQuestion' }
      responses:
        '201':
          description: Question created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExaminationQuestionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator role required }
        '409': { description: A question with identical text already exists }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/admin/examination-of-conscience/{questionId}:
    patch:
      summary: Update an examination-of-conscience question
      parameters:
        - { $ref: '#/components/parameters/ExaminationQuestionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateExaminationQuestion' }
      responses:
        '200':
          description: Question updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExaminationQuestionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator role required }
        '404': { description: Question not found }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Delete an examination-of-conscience question
      parameters:
        - { $ref: '#/components/parameters/ExaminationQuestionId' }
      responses:
        '204': { description: Question deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator role required }
        '404': { description: Question not found }
  /api/v1/liturgy/today:
    get:
      summary: Get today’s Mass readings
      description: >-
        Resolves today in the configured LITURGY_TIMEZONE, then returns the
        universal Roman-calendar celebration and locally curated Scripture
        references with verse text from checked-in local book files. The
        default text is NABRE; locale=es or an es-* locale selects the Spanish
        Biblia de Jerusalén and adds localizedCitation. For country=US, a
        versioned local USCCB snapshot takes precedence and returns its source
        metadata. No external liturgical or Bible service is called at request
        time.
      parameters:
        - { $ref: '#/components/parameters/LiturgyCountry' }
        - { $ref: '#/components/parameters/LiturgyDiocese' }
        - { $ref: '#/components/parameters/LiturgyLocale' }
      responses:
        '200':
          description: The current day’s liturgical context and Mass readings
          headers:
            Content-Language:
              schema: { type: string, enum: [en, es] }
              description: Language of the returned Scripture text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MassReadingsResponse' }
        '400': { description: Invalid country, diocese, or locale }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The calendar resolved but no curated lectionary entry exists }
  /api/v1/liturgy/readings/{date}:
    get:
      summary: Get Mass readings for a calendar date
      description: >-
        Resolves the requested civil date before looking up a structured local
        lectionary entry. The requested date must be YYYY-MM-DD; invalid or
        impossible dates return INVALID_DATE. Major celebrations may return
        multiple readingSets (for example, Christmas Vigil, Night, Dawn, and
        Day) while readings is the first applicable set for convenience.
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
        - { $ref: '#/components/parameters/LiturgyCountry' }
        - { $ref: '#/components/parameters/LiturgyDiocese' }
        - { $ref: '#/components/parameters/LiturgyLocale' }
      responses:
        '200':
          description: The day’s liturgical context and Mass readings
          headers:
            Content-Language:
              schema: { type: string, enum: [en, es] }
              description: Language of the returned Scripture text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MassReadingsResponse' }
        '400': { description: INVALID_DATE, INVALID_COUNTRY, INVALID_DIOCESE, or INVALID_LOCALE }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: READINGS_NOT_FOUND; no citation is guessed }
  /api/v1/locations/countries:
    get:
      summary: List or autocomplete countries
      description: >-
        Returns active countries alphabetically. When q is supplied, exact ISO
        code and name matches rank first, followed by prefix and substring
        matches.
      parameters:
        - in: query
          name: q
          description: Optional case-insensitive country name or ISO2 search.
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: Country autocomplete page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountrySearchResponse' }
              example:
                data:
                  - code: US
                    name: United States
                    latitude: 39.8283
                    longitude: -98.5795
                meta: { limit: 20, offset: 0, hasMore: false, nextOffset: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/churches:
    get:
      summary: Search approved churches
      description: >-
        Requires at least one country, city, or diocese filter. When more than
        one is supplied, all supplied filters must match the same church. City
        is a church-city name used only for directory search and display.
      parameters:
        - in: query
          name: countryCode
          schema: { type: string, minLength: 2, maxLength: 6, pattern: '^[A-Z]{2}(?:-[A-Z]{3})?$' }
        - in: query
          name: city
          schema: { type: string, maxLength: 150 }
        - in: query
          name: diocese
          schema: { type: string, maxLength: 160 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Church directory page
          content:
            application/json:
              example:
                data:
                  - id: c6000000-0000-4000-8000-000000000001
                    name: St. Mary Cathedral
                    city: Austin
                    regionName: Texas
                    countryCode: US
                    dioceseName: Diocese of Austin
                    timezone: America/Chicago
                    latitude: 30.270833
                    longitude: -97.743057
                meta: { limit: 20, offset: 0, hasMore: false, nextOffset: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/users/search:
    get:
      summary: Search active users by username
      description: >-
        Authenticated username discovery. Searches case-insensitively for a
        literal username substring, excludes the current user, and returns
        users regardless of leaderboard visibility. The response contains only
        username, avatar URL, title, and the caller's relationship state.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 30
            pattern: '^[a-zA-Z0-9_]+$'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: User search page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSearchResponse' }
              example:
                data:
                  - username: johnpaul
                    avatarUrl: 'https://example.com/avatars/johnpaul.png'
                    title: Scripture Seeker
                    relationshipState: incomingPending
                meta: { limit: 20, offset: 0, hasMore: false, nextOffset: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/churches/{churchId}:
    get:
      summary: Get church details and live service status
      description: >-
        Returns the church address, diocese, recurring weekday Mass,
        confession, and adoration schedules, plus status calculated at request
        time in the church's timezone. Church latitude and longitude are
        included. A time with no end uses a one-hour duration. Service-status
        booleans may overlap.
      parameters:
        - in: path
          name: churchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Church details, schedule, and live status
          content:
            application/json:
              example:
                data:
                  id: c6000000-0000-4000-8000-000000000001
                  name: St. Mary Cathedral
                  diocese: { id: c5000000-0000-4000-8000-000000000001, name: Diocese of Austin, countryCode: US }
                  address: { line1: 203 E 10th St, line2: null, city: Austin, regionName: Texas, postalCode: '78701', countryCode: US }
                  timezone: America/Chicago
                  latitude: 30.270833
                  longitude: -97.743057
                  schedule:
                    - { id: c7000000-0000-4000-8000-000000000001, serviceType: mass, weekday: sunday, startTime: '09:00', endTime: '10:00', usesDefaultOneHourDuration: false }
                  liveStatus: { isOpenNow: false, services: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Church not found }
  /api/v1/me/churches:
    get:
      summary: List the current user's linked churches
      responses:
        '200':
          description: Linked churches and primary state
          content:
            application/json:
              example:
                data:
                  - church:
                      id: c6000000-0000-4000-8000-000000000001
                      name: St. Mary Cathedral
                      city: Austin
                      regionName: Texas
                      countryCode: US
                      timezone: America/Chicago
                      latitude: 30.270833
                      longitude: -97.743057
                      isActive: true
                    isPrimary: true
                    linkedAt: '2026-08-01T12:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Link a church to the current user
      description: >-
        Set isPrimary to true to atomically make this church the user's only
        primary church.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [churchId]
              properties:
                churchId: { type: string, format: uuid }
                isPrimary: { type: boolean, default: false }
      responses:
        '201':
          description: Church linked
          content:
            application/json:
              example:
                data: { churchId: c6000000-0000-4000-8000-000000000001, isPrimary: true, created: true }
        '200':
          description: Church was already linked
          content:
            application/json:
              example:
                data: { churchId: c6000000-0000-4000-8000-000000000001, isPrimary: true, created: false }
        '404': { description: Church not found }
  /api/v1/me/churches/{churchId}:
    patch:
      summary: Set a linked church as primary
      parameters:
        - in: path
          name: churchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isPrimary]
              properties:
                isPrimary: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Primary church updated
          content:
            application/json:
              example:
                data: { churchId: c6000000-0000-4000-8000-000000000001, isPrimary: true }
        '404': { description: Church is not linked to the current user }
    delete:
      summary: Unlink a church from the current user
      parameters:
        - in: path
          name: churchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Church unlinked. The successful response body is empty. }
        '404': { description: Church is not linked to the current user }
  /api/v1/church-change-requests:
    get:
      summary: List the current user's church change requests
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected, all], default: all }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Current-user change request page
          content:
            application/json:
              example:
                data:
                  - id: c8000000-0000-4000-8000-000000000001
                    submitted_by: 9629e3e7-72dc-4bb1-94d3-b5a2bdd9f002
                    request_type: schedule_update
                    church_id: c6000000-0000-4000-8000-000000000001
                    proposed_church: {}
                    proposed_service_times: []
                    notes: Added an evening Mass.
                    status: pending
                    reviewed_by: null
                    reviewed_at: null
                    rejection_reason: null
                    created_at: '2026-08-17T12:00:00Z'
                    updated_at: '2026-08-17T12:00:00Z'
                meta: { limit: 20, offset: 0, hasMore: false, nextOffset: null }
    post:
      summary: Submit a church creation or schedule replacement request
      description: >-
        Create requests include church details, required latitude/longitude,
        and a full recurring schedule.
        Schedule-update requests replace the church's entire recurring schedule
        only after an administrator approves them.
      responses:
        '201':
          description: Pending church change request created
          content:
            application/json:
              example:
                data:
                  id: c8000000-0000-4000-8000-000000000001
                  request_type: schedule_update
                  church_id: c6000000-0000-4000-8000-000000000001
                  status: pending
                  created_at: '2026-08-17T12:00:00Z'
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/admin/church-change-requests:
    get:
      summary: List church change requests for administrator review
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected, all], default: all }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Moderator review queue
          content:
            application/json:
              example:
                data:
                  - id: c8000000-0000-4000-8000-000000000001
                    submitted_by: 9629e3e7-72dc-4bb1-94d3-b5a2bdd9f002
                    request_type: schedule_update
                    church_id: c6000000-0000-4000-8000-000000000001
                    status: pending
                    proposed_church: {}
                    proposed_service_times: []
                    notes: Added an evening Mass.
                    created_at: '2026-08-17T12:00:00Z'
                meta: { limit: 20, offset: 0, hasMore: false, nextOffset: null }
        '403': { description: Administrator role required }
  /api/v1/admin/church-change-requests/{requestId}:
    patch:
      summary: Approve or reject a church change request
      description: >-
        Approving a schedule-update request replaces the church's complete
        recurring schedule and grants the submitting user a repeatable
        Church Schedule Steward badge.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                rejectionReason: { type: string, nullable: true, maxLength: 2000 }
      responses:
        '200':
          description: Church change request reviewed
          content:
            application/json:
              example:
                data: { requestId: c8000000-0000-4000-8000-000000000001, status: approved, churchId: c6000000-0000-4000-8000-000000000001 }
        '403': { description: Administrator role required }
        '404': { description: Church change request not found }
        '409': { description: Church change request was already reviewed }
  /api/v1/me/friend-requests:
    get:
      summary: List the current user's friend requests
      description: >-
        Every row's user is the other person: the sender for incoming requests
        and the recipient for outgoing requests. Client actions should be based
        on both status and direction: incoming pending requests may be accepted
        or rejected, while outgoing pending requests may be cancelled.
      parameters:
        - in: query
          name: direction
          schema: { type: string, enum: [incoming, outgoing, all], default: incoming }
        - in: query
          name: status
          schema: { type: string, enum: [pending, accepted, rejected, cancelled, all], default: pending }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Friend request page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequestsResponse' }
              example:
                data:
                  - id: fb000000-0000-4000-8000-000000000002
                    status: pending
                    direction: incoming
                    createdAt: '2026-08-17T10:00:00Z'
                    respondedAt: null
                    cancelledAt: null
                    user:
                      id: 22222222-2222-4222-8222-222222222222
                      displayName: John Paul
                      username: johnpaul
                      avatarUrl: 'https://example.com/avatars/johnpaul.png'
                      title: Scripture Seeker
                      countryCode: US
                meta: { limit: 20, offset: 0, hasMore: false, nextOffset: null }
    post:
      summary: Send a username-based friend request
      description: >-
        Username matching is case-insensitive. A reciprocal pending request is
        accepted automatically; otherwise the recipient receives a notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 3, maxLength: 30 }
      responses:
        '201':
          description: Pending request created
          content:
            application/json:
              example:
                data: { requestId: fb000000-0000-4000-8000-000000000002, status: pending, automatic: false }
        '200':
          description: Reciprocal request accepted automatically
          content:
            application/json:
              example:
                data: { requestId: fb000000-0000-4000-8000-000000000002, friendshipId: fb000000-0000-4000-8000-000000000001, status: accepted, automatic: true }
        '409': { description: Users are already friends or a request is pending }
  /api/v1/me/friend-requests/{requestId}:
    patch:
      summary: Accept or reject an incoming friend request
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, rejected] }
      responses:
        '200':
          description: Friend request reviewed
          content:
            application/json:
              example:
                data: { requestId: fb000000-0000-4000-8000-000000000002, friendshipId: fb000000-0000-4000-8000-000000000001, status: accepted }
        '409': { description: Friend request is no longer pending }
    delete:
      summary: Cancel an outgoing pending friend request
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Friend request cancelled. The successful response body is empty. }
        '403': { description: Only the request sender can cancel it }
  /api/v1/me/friends:
    get:
      summary: List confirmed friends and shared stats
      description: >-
        Each card includes total XP, current level, Rosary total, and earned
        badge-instance count. Rosary totals include self-reported and verified
        activities, excluding rejected activities. Use include=rosaryStreak to
        add each friend's timezone-aware current and year-to-date longest Rosary
        streaks.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: include
          description: Adds timezone-aware Rosary streaks to each friend card.
          schema: { type: string, enum: [rosaryStreak] }
      responses:
        '200':
          description: Confirmed friends page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendsResponse' }
              example:
                data:
                  - id: 11111111-1111-4111-8111-111111111111
                    displayName: Maria Santos
                    username: mariasantos
                    avatarUrl: 'https://example.com/avatars/mariasantos.png'
                    title: Prayer Champion
                    countryCode: MX
                    totalXp: 920
                    currentLevel: { levelNumber: 3, code: disciple, name: Disciple }
                    rosaryTotal: 14
                    badgeCount: 2
                    friendsSince: '2026-08-01T12:00:00Z'
                    rosaryStreak: { asOfDate: '2026-08-17', currentStreak: 7, longestStreak: 12, timezone: America/Mexico_City }
                meta: { limit: 20, offset: 0, hasMore: false, nextOffset: null }
  /api/v1/me/friends/leaderboard:
    get:
      summary: Get the current user's friends-only leaderboard
      description: >-
        Uses the same period points as the global leaderboard, but calculates
        rank across the current user and their confirmed friends only. Each
        nested friend profile includes its nullable countryCode and
        saintAvatarId.
      parameters:
        - in: query
          name: periodType
          schema: { type: string, enum: [weekly, yearly], default: weekly }
        - in: query
          name: periodCode
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Friends-only ranked entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendsLeaderboardResponse' }
              example:
                data:
                  period: { id: 50000000-0000-4000-8000-000000000001, periodType: weekly, code: week-2026-W33, name: Week of 2026-08-10, startsAt: '2026-08-10T00:00:00Z', endsAt: '2026-08-17T00:00:00Z', status: active }
                  entries:
                    - rank: 1
                      points: 240
                      rosariesCount: 3
                      scriptureReadingsCount: 4
                      prayersCount: 9
                      isCurrentUser: false
                      friend: { id: 11111111-1111-4111-8111-111111111111, displayName: Maria Santos, username: mariasantos, avatarUrl: 'https://example.com/avatars/mariasantos.png', title: Prayer Champion, countryCode: MX, saintAvatarId: a1000000-0000-4000-8000-000000000002 }
                  currentUserEntry:
                    rank: 2
                    points: 120
                    rosariesCount: 1
                    scriptureReadingsCount: 2
                    prayersCount: 5
                    isCurrentUser: true
                    friend: { id: 9629e3e7-72dc-4bb1-94d3-b5a2bdd9f002, displayName: Test User, username: testuser, avatarUrl: 'https://example.com/avatars/testuser.png', title: Faithful Beginner, countryCode: US, saintAvatarId: null }
                  total: 2
  /api/v1/me/friends/comparison:
    get:
      summary: Compare progress with confirmed friends
      description: >-
        Returns the current user and confirmed friends ranked by the requested
        leaderboard period. Each entry includes period activity counts, total
        XP, lifetime points, current level, Rosary total, badge count, and
        timezone-aware current and year-to-date longest Rosary streaks. Each
        nested profile includes its nullable countryCode and saintAvatarId.
      parameters:
        - in: query
          name: periodType
          schema: { type: string, enum: [weekly, yearly], default: weekly }
        - in: query
          name: periodCode
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Friends comparison page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendsComparisonResponse' }
              example:
                data:
                  period: { id: 50000000-0000-4000-8000-000000000001, periodType: weekly, code: week-2026-W33, name: Week of 2026-08-10, startsAt: '2026-08-10T00:00:00Z', endsAt: '2026-08-17T00:00:00Z', status: active }
                  entries:
                    - rank: 1
                      periodPoints: 240
                      periodActivity: { rosariesCount: 3, scriptureReadingsCount: 4, prayersCount: 9 }
                      isCurrentUser: false
                      profile: { id: 11111111-1111-4111-8111-111111111111, displayName: Maria Santos, username: mariasantos, avatarUrl: 'https://example.com/avatars/mariasantos.png', title: Prayer Champion, countryCode: MX, saintAvatarId: a1000000-0000-4000-8000-000000000002 }
                      totalXp: 920
                      lifetimePoints: 2050
                      currentLevel: { levelNumber: 3, code: disciple, name: Disciple }
                      rosaryTotal: 14
                      badgeCount: 2
                      rosaryStreak: { asOfDate: '2026-08-17', currentStreak: 7, longestStreak: 12, timezone: America/Mexico_City }
                  total: 2
                  limit: 50
                  offset: 0
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No leaderboard period matches the request }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/friends/{friendId}:
    get:
      summary: Get a confirmed friend's stats and earned badges
      description: >-
        Returns total XP, current level, qualifying Rosary total, and every
        earned badge instance. Badge source metadata remains private.
      parameters:
        - in: path
          name: friendId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: include
          description: Adds the friend's timezone-aware Rosary streak.
          schema: { type: string, enum: [rosaryStreak] }
      responses:
        '200':
          description: Friend detail and earned badge history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendDetailResponse' }
              example:
                data:
                  friend: { id: 11111111-1111-4111-8111-111111111111, displayName: Maria Santos, username: mariasantos, avatarUrl: 'https://example.com/avatars/mariasantos.png', title: Prayer Champion, countryCode: MX }
                  progress:
                    totalXp: 920
                    currentLevel: { levelNumber: 3, code: disciple, name: Disciple, description: Growing in faithful discipleship., minimumTotalXp: 750, iconUrl: null, imageUrl: null }
                  rosaryTotal: 14
                  rosaryStreak: { asOfDate: '2026-08-17', currentStreak: 7, longestStreak: 12, timezone: America/Mexico_City }
                  badges: []
        '404': { description: Confirmed friendship not found }
    delete:
      summary: Unfriend a confirmed friend
      parameters:
        - in: path
          name: friendId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Friendship removed. The successful response body is empty. }
        '404': { description: Confirmed friendship not found }
  /api/v1/me:
    get:
      summary: Get current profile
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentProfileResponse' }
              example:
                data: { userId: 9629e3e7-72dc-4bb1-94d3-b5a2bdd9f002, displayName: Test User, username: testuser, avatarUrl: 'https://example.com/avatars/testuser.png', title: Faithful Beginner, gender: male, saintAvatarId: null, preferredLanguage: en, timezone: America/Chicago, countryCode: US, countryName: United States, leaderboardVisibility: public, prayerMapVisibility: aggregated, profileSetup: { complete: true, missingFields: [], nextStep: null, completedAt: '2026-08-17T12:00:00Z' }, createdAt: '2026-06-01T12:00:00Z', updatedAt: '2026-08-17T12:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Update current profile
      description: >-
        Usernames are checked case-insensitively for duplicates and screened
        against the same English and Spanish moderation data used by the
        username validation endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfile' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentProfileResponse' }
              example:
                data: { userId: 9629e3e7-72dc-4bb1-94d3-b5a2bdd9f002, displayName: Test User, username: testuser, avatarUrl: 'https://example.com/avatars/testuser.png', title: Prayer Warrior, gender: male, saintAvatarId: null, preferredLanguage: en, timezone: America/Chicago, countryCode: US, countryName: United States, leaderboardVisibility: public, prayerMapVisibility: aggregated, profileSetup: { complete: true, missingFields: [], nextStep: null, completedAt: '2026-08-17T12:00:00Z' }, createdAt: '2026-06-01T12:00:00Z', updatedAt: '2026-08-17T12:00:00Z' }
        '409': { description: Username conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Permanently delete the current account
      description: >-
        Permanently deletes the authenticated user's Auth identity and linked
        application data. The account's qualifying Rosary quantity is retained
        only as an anonymous contribution to the global lifetime total.
      responses:
        '204': { description: Account permanently deleted. The successful response body is empty. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/notification-preferences:
    get:
      summary: Get the current user's reminder preferences
      description: >-
        Returns persisted onboarding reminder choices. Missing legacy rows use
        enabled defaults. Loading this endpoint never requests OS notification
        permission.
      responses:
        '200':
          description: Current notification preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferencesResponse' }
              example:
                data:
                  dailyRosaryReminder: true
                  confessionReminder: true
                  eucharisticAdoration: true
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Incrementally update reminder preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationPreferences' }
      responses:
        '200':
          description: Updated notification preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferencesResponse' }
              example:
                data:
                  dailyRosaryReminder: true
                  confessionReminder: true
                  eucharisticAdoration: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/onboarding/complete:
    post:
      summary: Complete required profile onboarding
      description: >-
        Atomically validates and saves the canonical display name, optional
        username, gender, country, and reminder preferences. Completion is
        derived from the required persisted values rather than the audit
        timestamp alone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteProfileSetup' }
      responses:
        '200':
          description: Refreshed profile and reminder preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompleteProfileSetupResponse' }
              example:
                data:
                  profile:
                    userId: 9629e3e7-72dc-4bb1-94d3-b5a2bdd9f002
                    displayName: Samuel Ruiz
                    username: SamuelR
                    avatarUrl: null
                    title: null
                    gender: male
                    saintAvatarId: null
                    preferredLanguage: en
                    timezone: America/Chicago
                    countryCode: US
                    countryName: United States
                    leaderboardVisibility: public
                    prayerMapVisibility: aggregated
                    profileSetup:
                      complete: true
                      missingFields: []
                      nextStep: null
                      completedAt: '2026-08-28T18:52:34.591Z'
                    createdAt: '2026-08-28T18:40:00.000Z'
                    updatedAt: '2026-08-28T18:52:34.591Z'
                  notificationPreferences:
                    dailyRosaryReminder: true
                    confessionReminder: true
                    eucharisticAdoration: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Username conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/usernames/validate:
    get:
      summary: Validate a username and get available suggestions
      description: >-
        Checks the username format, English and Spanish prohibited-term data,
        and case-insensitive availability. Always returns five currently
        available, time-seeded Christian and saint-themed suggestions. A
        username already assigned to the current user remains available.
      parameters:
        - in: query
          name: username
          required: true
          description: Username candidate to validate. Leading and trailing whitespace is trimmed.
          schema: { type: string, minLength: 1, maxLength: 100, example: joyful_clare }
      responses:
        '200':
          description: Validation result and five available suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsernameValidationResponse' }
              examples:
                available:
                  value:
                    data:
                      username: joyful_clare
                      normalizedUsername: joyful_clare
                      valid: true
                      available: true
                      reason: null
                      suggestions: [faithful_clare1842, monica_dove7391, hopeful_pilgrim2318, dominic_witness4430, joyful_rosary8724]
                taken:
                  value:
                    data:
                      username: TakenName
                      normalizedUsername: takenname
                      valid: true
                      available: false
                      reason: USERNAME_TAKEN
                      suggestions: [humble_teresa1842, kolbe_fisher7391, peaceful_lantern2318, francis_witness4430, prayerful_dove8724]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/rosary/completion:
    get:
      summary: Get timezone-aware rosary completion by month and year
      description: >-
        Returns all twelve months for the selected year plus every calendar
        day in the selected month. Completion days are grouped in the
        authenticated user's configured timezone; multiple rosaries on one
        local date count once. Each `days` entry contains `day`, ISO `date`,
        and `completed`. The day list includes dates before account creation
        and future dates; `completed` is `null` for a future date. The
        selected month does not change the year-to-date calculation.
      parameters:
        - in: query
          name: selectedYear
          description: Defaults to the authenticated user's current local year.
          schema: { type: integer, minimum: 1, maximum: 9998 }
        - in: query
          name: selectedMonth
          description: Defaults to the authenticated user's current local month; used only as UI focus metadata.
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: Year-to-date, twelve-month, and selected-month daily rosary completion
          content:
            application/json:
              example:
                data:
                  selectedYear: 2026
                  selectedMonth: 8
                  timezone: America/Chicago
                  yearToDateCompletedDays: 42
                  months:
                    - { month: 8, completedDays: 7 }
                  days:
                    - { day: 1, date: '2026-08-01', completed: true }
                    - { day: 2, date: '2026-08-02', completed: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/rosary/streak:
    get:
      summary: Get current and year-to-date longest Rosary streaks
      description: >-
        Returns timezone-aware streaks for the authenticated user. A local day
        counts when at least one self-reported or verified Rosary has been
        completed. The current streak ends today, or yesterday when today is
        still incomplete; it resets after a full missed local day. The longest
        streak is calculated from completed days in the current local calendar
        year through today.
      responses:
        '200':
          description: Current and year-to-date longest Rosary streaks
          content:
            application/json:
              example:
                data: { asOfDate: '2026-08-17', currentStreak: 7, longestStreak: 12, timezone: America/Chicago }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/rosary/stats:
    get:
      summary: Get the authenticated user's lifetime Rosary total
      description: >-
        Returns the sum of quantities from all self-reported and verified
        Rosary activities. Rejected activities are excluded.
      responses:
        '200':
          description: Lifetime Rosary statistic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosaryStatsResponse' }
              example:
                data: { rosariesPrayed: 42 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/rosary/stats:
    get:
      security:
        - supabaseBearer: []
        - {}
      summary: Get the global lifetime Rosary total
      description: >-
        Returns the lifetime sum of self-reported and verified Rosary activity
        quantities across all users. Anonymous requests return a null current-user
        contribution. When valid Supabase cookie or Bearer authentication is
        supplied, the response also includes that user's qualifying lifetime total
        and percentage of the global total, rounded to four decimal places.
        Rejected activities are excluded. Invalid supplied Bearer credentials
        return an authentication error.
      responses:
        '200':
          description: Global lifetime Rosary statistic and optional user contribution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalRosaryStatsResponse' }
              examples:
                anonymous:
                  value:
                    data:
                      totalRosariesPrayed: 12345
                      currentUserContribution: null
                authenticated:
                  value:
                    data:
                      totalRosariesPrayed: 12345
                      currentUserContribution:
                        rosariesPrayed: 42
                        percentage: 0.3402
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/screen-data:
    get:
      summary: Load initial data for one authenticated application screen
      description: >-
        Loads the fixed initial sections for Home, Prayer, or Community in
        parallel. Each successful section preserves its source endpoint's
        `data` and optional `meta` payload. A failed independent section is
        returned as null and described by `meta.errors`; request validation and
        authentication failures remain normal top-level errors. Global Rosary
        statistics are intentionally excluded and remain lazy-loaded.
      parameters:
        - in: query
          name: screen
          required: true
          schema: { type: string, enum: [home, prayer, community] }
        - in: query
          name: country
          schema: { type: string, minLength: 1, maxLength: 10 }
          description: Optional Home liturgy country.
        - in: query
          name: diocese
          schema: { type: string, minLength: 1, maxLength: 120 }
          description: Optional Home liturgy diocese.
        - in: query
          name: locale
          schema: { type: string, minLength: 1, maxLength: 35 }
          description: Optional Home liturgy locale.
        - in: query
          name: selectedMonth
          schema: { type: integer, minimum: 1, maximum: 12 }
          description: Optional Prayer Rosary-completion month.
        - in: query
          name: selectedYear
          schema: { type: integer, minimum: 1, maximum: 9998 }
          description: Optional Prayer Rosary-completion year.
      responses:
        '200':
          description: Requested screen snapshot, including any isolated section errors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreenDataResponse' }
              examples:
                community:
                  value:
                    data:
                      screen: community
                      sections:
                        friends: { data: [], meta: { limit: 20, offset: 0, hasMore: false, nextOffset: null } }
                        incomingFriendRequests: { data: [], meta: { limit: 20, offset: 0, hasMore: false, nextOffset: null } }
                        friendsWeeklyLeaderboard: { data: [] }
                    meta:
                      errors: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/progress:
    get:
      summary: Get XP and level progress
      parameters:
        - { $ref: '#/components/parameters/CatalogLanguage' }
      responses:
        '200':
          description: Progress summary
          content:
            application/json:
              example:
                data:
                  totalXp: 920
                  lifetimePoints: 2050
                  weeklyPoints: 240
                  yearlyPoints: 1250
                  lastActivityAt: '2026-08-17T10:30:00Z'
                  version: 18
                  currentLevel: { level_number: 3, code: disciple, name: Disciple, minimum_total_xp: 750 }
                  nextLevel: { level_number: 4, code: witness, name: Witness, minimum_total_xp: 1500 }
                  levelProgressPercentage: 22.67
                  xpIntoCurrentLevel: 170
                  xpRequiredForNextLevel: 750
                  updatedAt: '2026-08-17T10:30:00Z'
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/levels:
    get:
      summary: List active level definitions
      description: >-
        Returns active levels with `icon_url` and `image_url` resolved to
        public Supabase Storage URLs when an image path is configured.
      parameters:
        - { $ref: '#/components/parameters/CatalogLanguage' }
      responses:
        '200':
          description: Active levels
          content:
            application/json:
              example:
                data:
                  - { level_number: 1, code: awakened, name: Awakened, description: Begins recognizing the battle., minimum_total_xp: 0, icon_url: 'https://example.supabase.co/storage/v1/object/public/images/levels/awakened-icon.png', image_url: 'https://example.supabase.co/storage/v1/object/public/images/levels/awakened.png', is_active: true }
                  - { level_number: 2, code: seeker, name: Seeker, description: Starts building daily habits., minimum_total_xp: 250, icon_url: 'https://example.supabase.co/storage/v1/object/public/images/levels/seeker-icon.png', image_url: 'https://example.supabase.co/storage/v1/object/public/images/levels/seeker.png', is_active: true }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/virtues:
    get:
      summary: Get active virtue definitions and the current user's values
      parameters:
        - { $ref: '#/components/parameters/CatalogLanguage' }
      responses:
        '200':
          description: Virtue dashboard data
          content:
            application/json:
              example:
                data:
                  - definition: { code: COURAGE, name: Courage, description: Faithful strength in adversity., default_value: 0, is_active: true }
                    currentValue: 18
                    initialized: true
                    updatedAt: '2026-08-17T10:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/demons:
    get:
      summary: List active demon catalog entries
      description: Includes each demon's saint mentor and virtue affinities.
      parameters:
        - { $ref: '#/components/parameters/CatalogLanguage' }
      responses:
        '200':
          description: Demon catalog
          content:
            application/json:
              example:
                data:
                  - demon: { id: d1000000-0000-4000-8000-000000000001, code: DISCOURAGEMENT, name: Demon of Discouragement, category: spiritual, is_active: true }
                    saintMentor: { id: d2000000-0000-4000-8000-000000000001, name: St. Michael the Archangel, is_active: true }
                    virtueAffinities:
                      - { demon_id: d1000000-0000-4000-8000-000000000001, virtue_code: COURAGE, multiplier: 1.2 }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/demons/{demonCode}:
    get:
      summary: Get one demon's battle definition
      parameters:
        - { $ref: '#/components/parameters/CatalogLanguage' }
        - in: path
          name: demonCode
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Demon attacks, defenses, affinities, mentor, and defeat reward
          content:
            application/json:
              example:
                data:
                  demon: { id: d1000000-0000-4000-8000-000000000001, code: DISCOURAGEMENT, name: Demon of Discouragement, category: spiritual, is_active: true }
                  saintMentor: { id: d2000000-0000-4000-8000-000000000001, name: St. Michael the Archangel }
                  attacks:
                    - { id: d3000000-0000-4000-8000-000000000001, code: SELF_DOUBT, name: Self Doubt, damage: 10 }
                  defenses:
                    - { id: d4000000-0000-4000-8000-000000000001, code: PRAY_SCRIPTURE, name: Pray with Scripture, virtue_code: COURAGE }
                  virtueAffinities:
                    - { demon_id: d1000000-0000-4000-8000-000000000001, virtue_code: COURAGE, multiplier: 1.2 }
                  defeatReward: { xp_reward: 100, virtue_bonus: 5 }
        '404': { description: Demon not found }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/encounters:
    get:
      summary: List current-user demon encounters
      parameters:
        - { $ref: '#/components/parameters/CatalogLanguage' }
        - in: query
          name: status
          schema:
            type: string
            enum: [active, defeated, abandoned, expired, all]
            default: all
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: before
          description: Started-at cursor from the prior response.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Encounter page with demon summaries
          content:
            application/json:
              example:
                data:
                  - encounter: { id: e1000000-0000-4000-8000-000000000001, user_id: 9629e3e7-72dc-4bb1-94d3-b5a2bdd9f002, demon_id: d1000000-0000-4000-8000-000000000001, status: active, current_hp: 70, started_at: '2026-08-17T09:00:00Z' }
                    demon: { id: d1000000-0000-4000-8000-000000000001, code: DISCOURAGEMENT, name: Demon of Discouragement }
                meta: { limit: 20, hasMore: false, nextCursor: null }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Start a demon encounter
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartEncounter' }
      responses:
        '201':
          description: Encounter and first defense assignment created
          content:
            application/json:
              example:
                data:
                  replayed: false
                  encounter: { id: e1000000-0000-4000-8000-000000000001, status: active, current_hp: 100 }
                  assignment: { id: e2000000-0000-4000-8000-000000000001, assignment_sequence: 1, status: active }
        '200':
          description: Idempotent replay of a prior encounter start
          content:
            application/json:
              example:
                data:
                  replayed: true
                  encounter: { id: e1000000-0000-4000-8000-000000000001, status: active, current_hp: 100 }
                  assignment: { id: e2000000-0000-4000-8000-000000000001, assignment_sequence: 1, status: active }
        '409': { description: The selected demon already has an active encounter }
  /api/v1/encounters/{encounterId}:
    get:
      summary: Get one current-user encounter and battle timeline
      parameters:
        - $ref: '#/components/parameters/EncounterId'
        - { $ref: '#/components/parameters/CatalogLanguage' }
        - in: query
          name: timelineLimit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: timelineBefore
          description: Battle-event timestamp cursor from the prior response.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Encounter, assigned defenses, and timeline page
          content:
            application/json:
              example:
                data:
                  encounter: { id: e1000000-0000-4000-8000-000000000001, status: active, current_hp: 70, started_at: '2026-08-17T09:00:00Z' }
                  demon: { id: d1000000-0000-4000-8000-000000000001, code: DISCOURAGEMENT, name: Demon of Discouragement }
                  assignments:
                    - assignment: { id: e2000000-0000-4000-8000-000000000001, assignment_sequence: 1, status: completed }
                      defense: { id: d4000000-0000-4000-8000-000000000001, code: PRAY_SCRIPTURE, name: Pray with Scripture }
                  timeline:
                    - event: { id: e3000000-0000-4000-8000-000000000001, event_type: defense_completed, occurred_at: '2026-08-17T09:15:00Z' }
                      virtueEvent: { id: e4000000-0000-4000-8000-000000000001, virtue_code: COURAGE, change_amount: 2 }
                meta: { timelineLimit: 20, hasMore: false, nextTimelineCursor: null }
        '404': { description: Encounter not found or not owned by the current user }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/encounters/{encounterId}/defenses/{assignmentId}/complete:
    post:
      summary: Complete an assigned demon defense
      description: >-
        The server validates ownership and assignment status, then calculates
        virtue changes, damage, defeat rewards, and notifications atomically.
      parameters:
        - $ref: '#/components/parameters/EncounterId'
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Authoritative battle result
          content:
            application/json:
              example:
                data:
                  replayed: false
                  encounter: { id: e1000000-0000-4000-8000-000000000001, status: active, current_hp: 55 }
                  assignment: { id: e2000000-0000-4000-8000-000000000001, status: completed }
                  damageDealt: 15
                  virtueChanges: [{ virtueCode: COURAGE, delta: 2, currentValue: 20 }]
                  newBadges: []
        '404': { description: Encounter or defense assignment not found }
        '409': { description: Encounter or assignment is no longer active }
  /api/v1/encounters/{encounterId}/abandon:
    post:
      summary: Abandon an active demon encounter
      parameters:
        - $ref: '#/components/parameters/EncounterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Encounter abandoned and open defenses cancelled
          content:
            application/json:
              example:
                data:
                  replayed: false
                  encounter: { id: e1000000-0000-4000-8000-000000000001, status: abandoned, abandoned_at: '2026-08-17T10:00:00Z' }
        '404': { description: Encounter not found }
        '409': { description: Encounter is no longer active }
  /api/v1/activities:
    get:
