                  activity: { id: a1000000-0000-4000-8000-000000000001, activityCode: ROSARY, quantity: 1, verificationStatus: self_reported }
                  xp: { points: 25, totalXp: 945, currentLevel: 3 }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/challenges:
