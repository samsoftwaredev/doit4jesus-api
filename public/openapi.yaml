openapi: 3.1.0
info:
  title: Holy Competition API
  version: 1.0.0
  description: >-
    REST API implemented with Next.js 16 Route Handlers and Supabase Auth.
    Browser clients may authenticate with Supabase SSR cookies; native clients
    may send a Supabase access token as a Bearer token.
servers:
  - url: https://api.example.com
  - url: http://localhost:3000
security:
  - supabaseBearer: []
paths:
  /api/v1/health:
    get:
      security: []
      summary: Service health
      responses:
        '200':
          description: Healthy
  /api/v1/me:
    get:
      summary: Get current profile
      responses:
        '200': { description: Current profile }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Update current profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfile' }
      responses:
        '200': { description: Updated profile }
        '409': { description: Username conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/progress:
    get:
      summary: Get XP and level progress
      responses:
        '200': { description: Progress summary }
  /api/v1/levels:
    get:
      summary: List active level definitions
      responses:
        '200': { description: Active levels }
  /api/v1/virtues:
    get:
      summary: Get active virtue definitions and the current user's values
      responses:
        '200': { description: Virtue dashboard data }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/demons:
    get:
      summary: List active demon catalog entries
      description: Includes each demon's saint mentor and virtue affinities.
      responses:
        '200': { description: Demon catalog }
  /api/v1/demons/{demonCode}:
    get:
      summary: Get one demon's battle definition
      parameters:
        - in: path
          name: demonCode
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { description: Demon attacks, defenses, affinities, mentor, and defeat reward }
        '404': { description: Demon not found }
  /api/v1/encounters:
    get:
      summary: List current-user demon encounters
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, defeated, abandoned, expired, all]
            default: all
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: before
          description: Started-at cursor from the prior response.
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Encounter page with demon summaries }
    post:
      summary: Start a demon encounter
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartEncounter' }
      responses:
        '201': { description: Encounter and first defense assignment created }
        '200': { description: Idempotent replay of a prior encounter start }
        '409': { description: The selected demon already has an active encounter }
  /api/v1/encounters/{encounterId}:
    get:
      summary: Get one current-user encounter and battle timeline
      parameters:
        - $ref: '#/components/parameters/EncounterId'
        - in: query
          name: timelineLimit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: timelineBefore
          description: Battle-event timestamp cursor from the prior response.
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Encounter, assigned defenses, and timeline page }
        '404': { description: Encounter not found or not owned by the current user }
  /api/v1/encounters/{encounterId}/defenses/{assignmentId}/complete:
    post:
      summary: Complete an assigned demon defense
      description: >-
        The server validates ownership and assignment status, then calculates
        virtue changes, damage, defeat rewards, and notifications atomically.
      parameters:
        - $ref: '#/components/parameters/EncounterId'
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Authoritative battle result }
        '404': { description: Encounter or defense assignment not found }
        '409': { description: Encounter or assignment is no longer active }
  /api/v1/encounters/{encounterId}/abandon:
    post:
      summary: Abandon an active demon encounter
      parameters:
        - $ref: '#/components/parameters/EncounterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Encounter abandoned and open defenses cancelled }
        '404': { description: Encounter not found }
        '409': { description: Encounter is no longer active }
  /api/v1/activities:
    get:
      summary: List the current user's activities
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: before
          description: ISO timestamp cursor from the previous response.
          schema: { type: string, format: date-time }
        - in: query
          name: activityCode
          schema: { type: string }
      responses:
        '200': { description: Activity page }
    post:
      summary: Record an activity and apply its transactional effects
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordActivity' }
      responses:
        '201': { description: Activity recorded }
        '200': { description: Idempotent replay of an existing result }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/challenges:
    get:
      summary: List challenge assignments
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, completed, expired, cancelled, all]
            default: active
      responses:
        '200': { description: Challenge assignments with definitions }
  /api/v1/challenges/{assignmentId}/claim:
    post:
      summary: Claim a completed challenge reward
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Reward claim result }
        '404': { description: Assignment not found }
        '409': { description: Assignment is not completed }
  /api/v1/badges:
    get:
      summary: List badge definitions, earned badges, aggregate progress, and individual unlock requirements
      responses:
        '200': { description: Badge catalog for the current user }
  /api/v1/leaderboards:
    get:
      summary: Get leaderboard entries
      parameters:
        - in: query
          name: periodType
          schema:
            type: string
            enum: [daily, weekly, monthly, yearly, season]
            default: weekly
        - in: query
          name: periodCode
          schema: { type: string }
        - in: query
          name: scopeType
          schema:
            type: string
            enum: [global, country, city]
            default: global
        - in: query
          name: scopeReference
          schema: { type: string, default: global }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Ranked entries }
  /api/v1/prayer-map:
    get:
      summary: Get privacy-filtered prayer-map markers
      parameters:
        - in: query
          name: level
          required: true
          schema: { type: string, enum: [country, city] }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: countryCode
          schema: { type: string, minLength: 2, maxLength: 2 }
      responses:
        '200': { description: Aggregated map markers }
  /api/v1/notifications:
    get:
      summary: List current-user notifications
      parameters:
        - in: query
          name: unreadOnly
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: before
          description: Created-at cursor from the prior response.
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Notifications }
  /api/v1/notifications/{notificationId}/read:
    patch:
      summary: Mark one notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Marked as read }
components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: A unique client-generated key. Repeating the same request returns the original result without duplicate rewards.
      schema: { type: string, minLength: 1, maxLength: 150 }
    EncounterId:
      in: path
      name: encounterId
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing or invalid Supabase Auth session
    ValidationError:
      description: Request validation failed
  schemas:
    StartEncounter:
      type: object
      additionalProperties: false
      required: [demonCode]
      properties:
        demonCode: { type: string, minLength: 1, maxLength: 100 }
    UpdateProfile:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 2, maxLength: 80 }
        username:
          anyOf:
            - { type: string, minLength: 3, maxLength: 30, pattern: '^[a-zA-Z0-9_]+$' }
            - { type: 'null' }
        avatarUrl:
          anyOf:
            - { type: string, format: uri }
            - { type: 'null' }
        title:
          anyOf:
            - { type: string, maxLength: 100 }
            - { type: 'null' }
        preferredLanguage: { type: string, minLength: 2, maxLength: 10 }
        timezone: { type: string }
        cityId:
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        countryCode:
          anyOf:
            - { type: string, minLength: 2, maxLength: 2 }
            - { type: 'null' }
        leaderboardVisibility:
          type: string
          enum: [public, friends, private]
        prayerMapVisibility:
          type: string
          enum: [aggregated, hidden]
    RecordActivity:
      type: object
      additionalProperties: false
      required: [activityCode, occurredAt]
      properties:
        activityCode: { type: string, maxLength: 50 }
        occurredAt: { type: string, format: date-time }
        completedAt:
          anyOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        durationSeconds:
          anyOf:
            - { type: integer, minimum: 0, maximum: 86400 }
            - { type: 'null' }
        quantity: { type: integer, minimum: 1, maximum: 100, default: 1 }
        cityId:
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        countryCode:
          anyOf:
            - { type: string, minLength: 2, maxLength: 2 }
            - { type: 'null' }
        metadata: { type: object, additionalProperties: true }
